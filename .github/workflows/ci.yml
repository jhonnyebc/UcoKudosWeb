# Quality gates del cliente web (ADR-0017). Corren en cada PR hacia develop o main y en cada push
# a esas ramas. Todas bloquean: una puerta que solo informa es documentación, no una puerta.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Un push a main **no cancela** la ejecución que ya está en marcha: esa ejecución puede estar a mitad
# de un despliegue, y cortarlo dejaría la máquina con la versión nueva a medias. Solo se cancelan las
# de los pull requests, que no despliegan nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cliente:
    name: Cliente (formato, análisis, tipos, pruebas y peso)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el archivo de bloqueo. Con
      # `install`, el pipeline podría estar probando versiones distintas de las del equipo, que es
      # la forma más silenciosa de que «en mi máquina funciona».
      - name: Instalar
        run: npm ci

      - name: Formato
        run: npm run formato

      - name: Análisis estático
        run: npm run lint

      # Los tipos se comprueban aparte de la construcción para que el mensaje diga qué falló. La
      # construcción también los comprueba, pero mezclados con los errores de empaquetado.
      - name: Tipos
        run: npx tsc --noEmit

      # Incluyen la verificación automática de accesibilidad (ADR-0015, punto 7).
      - name: Pruebas
        run: npm test

      - name: Construir
        run: npx vite build

      # **La puerta que hace que Mobile First sea medible.** Falla si la carga inicial supera los
      # 300 KB comprimidos de QA-MOV-01. Sin esto, el presupuesto se incumpliría poco a poco y sin
      # que nadie se enterara: ninguna biblioteca pesa mucho por sí sola, pesan todas juntas.
      - name: Presupuesto de peso (QA-MOV-01)
        run: npm run peso

  secretos:
    name: Escaneo de secretos (ADR-0018)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: un secreto borrado del archivo sigue en el historial.
          fetch-depth: 0

      # Fijada por SHA, no por etiqueta: una etiqueta se puede mover a código distinto (ADR-0017).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Vulnerabilidades de las dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Umbral en «high»: con el de por omisión, el ruido de avisos menores en dependencias de
      # desarrollo haría que nadie mirara el resultado, que es peor que no tener la puerta.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  imagen:
    name: Imagen del cliente
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [cliente]
    outputs:
      etiqueta: ${{ steps.etiqueta.outputs.valor }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # La etiqueta lleva la versión y el commit, nunca una etiqueta móvil: con `latest` no se
      # sabe qué está corriendo en el servidor (ADR-0016).
      - name: Calcular la etiqueta
        id: etiqueta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "valor=${VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/ucokudos-web:${{ steps.etiqueta.outputs.valor }}
          build-args: |
            VERSION=${{ steps.etiqueta.outputs.valor }}
            REVISION=${{ github.sha }}
            VITE_IDENTIDAD_EMISOR=${{ vars.VITE_IDENTIDAD_EMISOR }}
            VITE_IDENTIDAD_CLIENTE=${{ vars.VITE_IDENTIDAD_CLIENTE }}
            VITE_IDENTIDAD_AUDIENCIA=${{ vars.VITE_IDENTIDAD_AUDIENCIA }}

      # Solo se publica desde main: una imagen por cada push a cualquier rama llenaría el registro
      # de versiones que nadie va a desplegar.
      #
      # El lanzamiento manual también publica, y hace falta: cuando cambia una variable del
      # repositorio —la configuración de identidad, por ejemplo— hay que reconstruir la imagen sin
      # que el código haya cambiado. Con la condición anterior se construía y no se publicaba, en
      # silencio, que es la peor forma de fallar.
      - name: Publicar
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker push ghcr.io/${{ github.repository_owner }}/ucokudos-web:${{ steps.etiqueta.outputs.valor }}

  # Despliegue en la máquina (ADR-0016, revisión del 2026-11-13). Solo desde main, y solo cuando la
  # imagen se acaba de publicar. Despliega únicamente el cliente: la API conserva la versión que ya
  # tenía, y su repositorio la despliega por su lado.
  desplegar:
    name: Desplegar el cliente en el servidor
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [imagen]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    # Un despliegue a la vez, y nunca se corta uno en marcha.
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      CLAVE: ${{ secrets.DESPLIEGUE_SSH_KEY }}
      SERVIDOR: ${{ secrets.DESPLIEGUE_HOST }}
      USUARIO: ${{ secrets.DESPLIEGUE_USUARIO }}
      HUELLA: ${{ secrets.DESPLIEGUE_HUELLA_DEL_SERVIDOR }}
      ETIQUETA: ${{ needs.imagen.outputs.etiqueta }}
    steps:
      # Sin los secretos no se despliega, y **se dice en voz alta**: un trabajo que se omite en
      # silencio deja la duda de si lo desplegado es lo último. La advertencia queda en el resumen.
      - name: Comprobar que hay con qué desplegar
        id: config
        run: |
          if [ -n "$CLAVE" ] && [ -n "$SERVIDOR" ] && [ -n "$USUARIO" ] && [ -n "$HUELLA" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Despliegue omitido::Faltan secretos del despliegue (DESPLIEGUE_SSH_KEY, DESPLIEGUE_HOST, DESPLIEGUE_USUARIO, DESPLIEGUE_HUELLA_DEL_SERVIDOR). La imagen se publicó pero NO se desplegó. Ver docs/MANUAL-PUESTA-A-PUNTO.md, sección 8.5."
          fi

      # La llave solo puede pedir «desplegar <api|web> <etiqueta>»: en el servidor es una llave de
      # comando forzado (scripts/desplegar-desde-pipeline.sh), sin terminal ni reenvío de puertos.
      # La huella del servidor va fijada: sin ella, un impostor en la red recibiría la orden.
      - name: Desplegar `web` en el servidor
        if: steps.config.outputs.disponible == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/despliegue \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=20 \
            "$USUARIO@$SERVIDOR" "desplegar web $ETIQUETA"

      - name: Limpiar la llave
        if: always()
        run: rm -f ~/.ssh/despliegue
